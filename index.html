<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adrian Academics — Moving Forward Together</title>

  <!-- Tailwind CSS CDN for responsive layout and utility classes -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter (clean minimalist UI) & JetBrains Mono (code brackets) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* =========================================================================
       1. BASE RESET & THEME TOKENS
       Fixed original '- { box-sizing: border-box; }' typo to universal '*'
       ========================================================================= */
    * {
      box-sizing: border-box;
    }

    :root {
      --bg-github-dark: #0d1117;
      --bg-surface: rgba(22, 27, 34, 0.62);
      --glass-border: rgba(255, 255, 255, 0.18);
      --card-border: rgba(255, 255, 255, 0.12);
      --neon-purple: #7c3aed;
      --neon-purple-deep: #6d28d9;
      --neon-blue: #2563eb;
      --neon-blue-bright: #3b82f6;
      --neon-cyan: #06b6d4;
      --neon-cyan-bright: #22d3ee;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
      background-color: var(--bg-github-dark);
      color: #f0f6fc;
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      /* Subtle ambient top glow that blends seamlessly into #0d1117 */
      background-image:
        radial-gradient(circle at 18% 0%, rgba(124, 58, 237, 0.12), transparent 42%),
        radial-gradient(circle at 82% 8%, rgba(6, 182, 212, 0.10), transparent 38%);
    }

    /* =========================================================================
       2. HERO BANNER (3:1 ASPECT RATIO ON DESKTOP)
       ========================================================================= */
    .hero-banner {
      position: relative;
      width: 100%;
      /* Responsive height on small screens, exact 3:1 ratio on tablet/desktop */
      min-height: 280px;
      border-radius: 24px;
      overflow: hidden;
      background-color: #0d1117;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        0 24px 64px -16px rgba(0, 0, 0, 0.85),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
    }

    @media (min-width: 768px) {
      .hero-banner {
        aspect-ratio: 3 / 1;
        min-height: 300px;
      }
    }

    /* Subtle technical dot-grid texture inside the banner for studio depth */
    .hero-grid-overlay {
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: 28px 28px;
      mask-image: radial-gradient(ellipse at center, black 35%, transparent 82%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 35%, transparent 82%);
      pointer-events: none;
      z-index: 1;
    }

    /* =========================================================================
       3. FLOATING 3D ABSTRACT SHAPES & NEON ORBS
       Layered with radial studio highlights + soft blur to shine through glass
       ========================================================================= */
    .orb {
      position: absolute;
      border-radius: 9999px;
      pointer-events: none;
      will-change: transform;
      z-index: 2;
    }

    /* Deep Purple 3D Sphere (Left-Top) */
    .orb-purple {
      width: clamp(180px, 26vw, 340px);
      height: clamp(180px, 26vw, 340px);
      top: -18%;
      left: 10%;
      background: radial-gradient(
        circle at 32% 30%,
        #c084fc 0%,
        var(--neon-purple) 42%,
        var(--neon-purple-deep) 74%,
        rgba(76, 29, 149, 0.1) 100%
      );
      filter: blur(26px);
      opacity: 0.78;
      animation: float-slow 11s ease-in-out infinite;
    }

    /* Electric Blue 3D Pill/Orb (Center-Bottom behind glass card) */
    .orb-blue {
      width: clamp(200px, 28vw, 370px);
      height: clamp(140px, 19vw, 250px);
      bottom: -24%;
      left: 36%;
      background: radial-gradient(
        circle at 40% 35%,
        #93c5fd 0%,
        var(--neon-blue-bright) 38%,
        var(--neon-blue) 70%,
        rgba(30, 58, 138, 0.1) 100%
      );
      filter: blur(34px);
      opacity: 0.75;
      animation: float-medium 9.5s ease-in-out infinite reverse;
    }

    /* Vibrant Cyan 3D Sphere (Right-Top) */
    .orb-cyan {
      width: clamp(160px, 23vw, 310px);
      height: clamp(160px, 23vw, 310px);
      top: -12%;
      right: 11%;
      background: radial-gradient(
        circle at 35% 32%,
        #a5f3fc 0%,
        var(--neon-cyan-bright) 40%,
        var(--neon-cyan) 72%,
        rgba(8, 145, 178, 0.1) 100%
      );
      filter: blur(28px);
      opacity: 0.75;
      animation: float-drift 12.5s ease-in-out infinite;
    }

    /* Sculpted 3D Accent Ring (Sharp-soft hybrid for 3D geometric depth) */
    .shape-3d-torus {
      position: absolute;
      width: clamp(90px, 12vw, 155px);
      height: clamp(90px, 12vw, 155px);
      right: 23%;
      bottom: 8%;
      border-radius: 36% 64% 58% 42% / 44% 38% 62% 56%;
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.85), rgba(59, 130, 246, 0.7), rgba(124, 58, 237, 0.85));
      filter: blur(14px);
      opacity: 0.65;
      z-index: 2;
      pointer-events: none;
      animation: float-spin 15s ease-in-out infinite;
    }

    /* =========================================================================
       4. GLOWING CODE BRACKETS (</>) BEHIND THE FROSTED GLASS
       Positioned to cast colorful blurred reflections through the glass card
       ========================================================================= */
    .code-brackets-layer {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      pointer-events: none;
      z-index: 3;
      user-select: none;
    }

    .code-glyph {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.06em;
    }

    .code-glyph-left {
      font-size: clamp(3.5rem, 8.5vw, 7.5rem);
      background: linear-gradient(135deg, #c084fc 0%, #60a5fa 60%, #22d3ee 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: 0.42;
      filter: drop-shadow(0 0 26px rgba(124, 58, 237, 0.75)) blur(1px);
      transform: rotate(-8deg) translateX(12%);
      animation: float-slow 10s ease-in-out infinite;
    }

    .code-glyph-center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: clamp(5.5rem, 13vw, 11rem);
      background: linear-gradient(90deg, rgba(124, 58, 237, 0.65), rgba(59, 130, 246, 0.65), rgba(34, 211, 238, 0.7));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: 0.55;
      filter: drop-shadow(0 0 32px rgba(34, 211, 238, 0.55)) blur(2px);
      z-index: 3;
      pointer-events: none;
      user-select: none;
    }

    .code-glyph-right {
      font-size: clamp(3.5rem, 8.5vw, 7.5rem);
      background: linear-gradient(135deg, #22d3ee 0%, #3b82f6 55%, #a855f7 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: 0.42;
      filter: drop-shadow(0 0 26px rgba(6, 182, 212, 0.75)) blur(1px);
      transform: rotate(8deg) translateX(-12%);
      animation: float-medium 11.5s ease-in-out infinite;
    }

    /* =========================================================================
       5. CENTRAL FROSTED GLASSMORPHISM CARD
       Crisp white border, soft inner glow, and heavy translucent backdrop blur
       ========================================================================= */
    .hero-glass-card {
      position: relative;
      z-index: 10;
      width: min(88%, 620px);
      padding: clamp(1.75rem, 3.6vw, 2.75rem) clamp(1.5rem, 4.5vw, 3.5rem);
      text-align: center;
      border-radius: 20px;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.11) 0%,
        rgba(255, 255, 255, 0.04) 100%
      );
      backdrop-filter: blur(22px) saturate(160%);
      -webkit-backdrop-filter: blur(22px) saturate(160%);
      border: 1px solid var(--glass-border);
      box-shadow:
        /* Soft inner studio glow */
        inset 0 1px 1px rgba(255, 255, 255, 0.42),
        inset 0 0 28px rgba(255, 255, 255, 0.08),
        /* Soft colorful outer ambient shadow */
        0 20px 50px rgba(0, 0, 0, 0.55),
        0 0 40px rgba(59, 130, 246, 0.14);
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.35s ease;
    }

    .hero-glass-card:hover {
      border-color: rgba(255, 255, 255, 0.38);
    }

    /* =========================================================================
       6. GAMES / ACTIVITIES GRID & GLASS CARDS
       Preserves original .games-grid and .game-card structure in dark glass UI
       ========================================================================= */
    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 2rem;
      width: 100%;
    }

    .game-card {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
      max-width: 420px;
      justify-self: center;
      padding: 1rem;
      border-radius: 20px;
      text-decoration: none;
      background: linear-gradient(
        155deg,
        rgba(30, 37, 48, 0.68) 0%,
        rgba(17, 22, 30, 0.78) 100%
      );
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        0 10px 30px -10px rgba(0, 0, 0, 0.65);
      transition:
        transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.28s ease,
        box-shadow 0.28s ease,
        background-color 0.28s ease;
      overflow: hidden;
    }

    .game-card:hover,
    .game-card:focus-visible {
      transform: translateY(-6px);
      border-color: rgba(56, 189, 248, 0.55);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.22),
        0 18px 36px -12px rgba(0, 0, 0, 0.8),
        0 0 28px -4px rgba(34, 211, 238, 0.28),
        0 0 42px -10px rgba(124, 58, 237, 0.25);
      outline: none;
    }

    .game-cover-wrapper {
      position: relative;
      width: 100%;
      height: 200px;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 1rem;
      /* Polished fallback gradient if local image is unavailable */
      background: linear-gradient(135deg, #161b22 0%, #1e1b4b 52%, #083344 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .game-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .game-card:hover .game-cover {
      transform: scale(1.04);
    }

    .game-title {
      color: #f8fafc;
      font-weight: 600;
      font-size: 1.25rem;
      letter-spacing: -0.01em;
      text-align: left;
      word-break: break-word;
      transition: color 0.25s ease;
    }

    .game-card:hover .game-title {
      color: #38bdf8;
    }

    /* =========================================================================
       7. AMBIENT FLOATING ANIMATIONS
       ========================================================================= */
    @keyframes float-slow {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(16px, -14px) scale(1.05); }
    }

    @keyframes float-medium {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-18px, -12px) scale(1.04); }
    }

    @keyframes float-drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-14px, 16px) scale(1.06); }
    }

    @keyframes float-spin {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(12px, -16px) rotate(24deg); }
    }

    /* Respect user reduced-motion preferences */
    @media (prefers-reduced-motion: reduce) {
      .orb, .shape-3d-torus, .code-glyph-left, .code-glyph-right {
        animation: none;
      }
      .game-card, .game-cover, .hero-glass-card {
        transition: none;
      }
    }
  </style>
</head>
<body class="antialiased selection:bg-cyan-500/30 selection:text-cyan-200">

  <!-- Main Page Wrapper (centered, max-width 1200px) -->

  <script>
    /**
     * Initialize dynamic footer year and subtle mouse-driven parallax
     * on the hero banner's 3D neon orbs (desktop pointer devices only).
     */
    (function () {
      try {
        const yearEl = document.getElementById('year');
        if (yearEl) {
          yearEl.textContent = new Date().getFullYear();
        }

        const banner = document.getElementById('heroBanner');
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        const hasFinePointer = window.matchMedia('(pointer: fine)').matches;

        if (!banner || prefersReducedMotion || !hasFinePointer) return;

        const parallaxItems = banner.querySelectorAll('[data-parallax]');

        banner.addEventListener('mousemove', (event) => {
          const rect = banner.getBoundingClientRect();
          const normX = (event.clientX - rect.left) / rect.width - 0.5;
          const normY = (event.clientY - rect.top) / rect.height - 0.5;

          parallaxItems.forEach((el) => {
            const depth = parseFloat(el.getAttribute('data-parallax')) || 12;
            const moveX = normX * depth;
            const moveY = normY * depth;
            el.style.marginLeft = `${moveX}px`;
            el.style.marginTop = `${moveY}px`;
          });
        });

        banner.addEventListener('mouseleave', () => {
          parallaxItems.forEach((el) => {
            el.style.marginLeft = '0px';
            el.style.marginTop = '0px';
          });
        });
      } catch (err) {
        console.error('Initialization error:', err);
      }
    })();
  </script>
